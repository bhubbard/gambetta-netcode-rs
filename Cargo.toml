[package]
name = "gambetta-netcode"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Pure Rust client-side prediction, server reconciliation, entity interpolation, and lag compensation netcode from Gabriel Gambetta"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/gambetta-netcode-rs"
readme = "README.md"
keywords = ["netcode", "multiplayer", "prediction", "reconciliation", "gamedev"]
categories = ["game-development", "network-programming"]

[dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
rand = "0.8"
